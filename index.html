<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Maze Adventure</title>
    <link rel="stylesheet" href="./css/styles.css">
    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>

<body>
    <div id="crosshair"></div>
    <div id="minimap-label">Map</div>

    <div id="ui-container">
        <div id="start-screen" class="overlay">
            <h1>MAZE ADVENTURE</h1>
            <p>Help the Dragon find the Castle!</p>
            <div class="controls-info">
                <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span
                        class="key">D</span> to Move</div>
                <div style="margin-top:10px"><span class="key">Mouse</span> to Look</div>
            </div>
            <br>
            <button id="start-btn">PLAY</button>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h1>YOU MADE IT!</h1>
            <p>Welcome to the Castle!</p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Main Logic -->
    <script type="module" src="./src/main.js"></script>
</body>

</html>
